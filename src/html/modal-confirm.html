    <!-- MODAL: Custom Confirm Dialog -->
    <dialog id="popup-confirm-modal" class="modal-overlay hidden" aria-modal="true">
      <div class="modal-card modal-card-sm">
        <h3 id="popup-confirm-title" class="danger-title">Confirm Action</h3>
        <p id="popup-confirm-msg" class="modal-desc-text"></p>
        <div id="popup-confirm-input-container" class="confirm-input-wrap hidden">
          <label id="popup-confirm-input-label" for="popup-confirm-input" class="confirm-label"></label>
          <input type="text" id="popup-confirm-input" class="field confirm-input-field" placeholder="Confirm text..." autocomplete="off" aria-label="Confirmation input">
        </div>
        <div class="modal-actions-row actions-center">
          <button type="button" id="popup-confirm-cancel-btn" class="submit-btn btn-compact" aria-label="Cancel confirmation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-sm"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            <span>Cancel</span>
          </button>
          <button type="button" id="popup-confirm-ok-btn" class="submit-btn btn-primary btn-compact" aria-label="Confirm action">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-sm"><polyline points="20 6 9 17 4 12"/></svg>
            <span>OK</span>
          </button>
        </div>
      </div>
    </dialog>

    <!-- MODAL: Custom Import Options Selection Dialog -->
    <dialog id="popup-import-options-modal" class="modal-overlay hidden" aria-modal="true">
      <div class="modal-card modal-card-md">
        <h3>Select Practice Mode</h3>
        <p class="modal-desc-text">Select which modes you want to activate for the imported items. You can choose to practice spelling, recall, or both:</p>
        
        <div class="import-options-stack">
          <button type="button" id="import-option-both" class="submit-btn btn-primary import-option-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-md"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
            <div class="import-option-text">
              <span class="import-option-title">Both Spelling & Recall</span>
              <span class="import-option-sub">Practice writing and definition recall</span>
            </div>
          </button>
          
          <button type="button" id="import-option-spelling" class="submit-btn import-option-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-md"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <div class="import-option-text">
              <span class="import-option-title">Spelling Practice Only</span>
              <span class="import-option-sub">Focus purely on typing/spelling correction</span>
            </div>
          </button>
          
          <button type="button" id="import-option-recall" class="submit-btn import-option-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-md"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <div class="import-option-text">
              <span class="import-option-title">Recall Practice Only</span>
              <span class="import-option-sub">Focus purely on meaning/definition retrieval</span>
            </div>
          </button>
        </div>

        <div class="modal-actions-row actions-center">
          <button type="button" id="import-option-cancel" class="submit-btn btn-compact" aria-label="Cancel Import">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-svg-sm"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            <span>Cancel Import</span>
          </button>
        </div>
      </div>
    </dialog>
