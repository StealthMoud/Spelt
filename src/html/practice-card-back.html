          <!-- Back Face -->
          <div class="card-face card-back">
            <button class="practice-edit-btn icon-btn card-edit-btn-top" title="Edit Word" aria-label="Edit Word">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>
            </button>
            <div class="back-header-row back-header-pad">
              <div class="back-header-flex">
                <div class="flex-items-center-gap">
                  <button id="back-ai-hint-btn" class="ai-sparkle-btn back-hint-btn hidden" title="AI Memory Hint" aria-label="AI Memory Hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="icon-svg-sm"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    <span>AI Hint</span>
                  </button>
                  <h3 id="back-word-display" class="word-title-reset"></h3>
                </div>
                <div id="spelling-result-badge" class="result-badge success">Correct</div>
              </div>
              <span id="back-transcription-display" class="back-transcription-text"></span>
              <div id="back-audio-container"></div>
              <p id="back-spelling-variants-row" class="back-variant-text hidden"></p>
            </div>
            <div class="back-details-list">
              <div id="spelling-memory-note" class="memory-note hidden"><span class="eyebrow">A WAY TO REMEMBER</span><p id="spelling-memory-text"></p></div>
              <p><strong>You typed:</strong> <span id="user-typed-display"></span></p>
              <div class="clue-header-flex">
                <p class="text-margin-reset"><strong>Definition:</strong> <span id="back-definition-display"></span></p>
                <button type="button" id="back-play-definition-btn" class="play-example-btn" title="Pronounce Definition" aria-label="Pronounce Definition">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
              </div>
              <p><strong>Part of Speech:</strong> <span id="back-part-of-speech-display" class="clue-pos-text"></span></p>
              <p id="back-translation-row" class="hidden"><strong>Translation:</strong> <span id="back-translation-display"></span></p>
              <p id="back-level-row" class="hidden"><strong>Level:</strong> <span id="back-level-display" class="clue-level-text"></span></p>
              <div id="back-example-container" class="hidden">
                <div class="clue-header-flex">
                  <p class="text-margin-reset"><strong>Example:</strong></p>
                  <div class="flex-gap-xs">
                    <button type="button" id="back-play-example-btn" class="play-example-btn" title="Pronounce Example" aria-label="Pronounce Example">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    </button>
                    <button type="button" id="back-translate-btn" class="translate-example-btn" title="Translate Example" aria-label="Translate Example">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                    </button>
                  </div>
                </div>
                <p id="back-example-display" class="clue-example-text"></p>
                <p id="back-example-translation-container" class="text-mt-xs hidden">
                  <strong>Translation:</strong> <span id="back-example-translation-display"></span>
                </p>
              </div>
              <div id="past-misspellings-container" class="hidden">
                <p><strong>Past errors:</strong> <span id="back-misspellings-display" class="text-danger-weight"></span></p>
              </div>
              <div class="back-card-metrics text-muted-xs">
                <span title="The review scheduler’s spacing multiplier">Review spacing: <strong id="back-card-ef">2.50</strong></span>
                <span class="metric-sep">·</span>
                <span>Past mistakes: <strong id="back-card-lapses">0</strong></span>
              </div>
            </div>

            <!-- SRS Buttons -->
            <div class="srs-rating-wrapper">
              <button class="srs-btn srs-again" data-score="1" aria-label="Rate 1: Again">
                <kbd class="srs-kbd">1</kbd>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="srs-icon"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                <span>Again</span>
                <small class="srs-hint">Incorrect</small>
              </button>
              <button class="srs-btn srs-hard" data-score="3" aria-label="Rate 2: Hard">
                <kbd class="srs-kbd">2</kbd>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="srs-icon"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Hard</span>
                <small class="srs-hint">1d</small>
              </button>
              <button class="srs-btn srs-good" data-score="4" aria-label="Rate 3: Good">
                <kbd class="srs-kbd">3</kbd>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="srs-icon"><polyline points="20 6 9 17 4 12"/></svg>
                <span>Good</span>
                <small class="srs-hint">6d</small>
              </button>
              <button class="srs-btn srs-easy" data-score="5" aria-label="Rate 4: Easy">
                <kbd class="srs-kbd">4</kbd>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="srs-icon"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                <span>Easy</span>
                <small class="srs-hint">12d</small>
              </button>
              <button class="srs-btn srs-mastered" data-score="mastered" aria-label="Rate 5: Mastered">
                <kbd class="srs-kbd">5</kbd>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="srs-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span>Mastered</span>
                <small class="srs-hint">Archive</small>
              </button>
            </div>
            <div class="keyboard-hint-strip" aria-label="Keyboard Shortcuts Hint">
              <span><kbd>1–5</kbd> Rate</span>
              <span><kbd>Space</kbd> Answer/Audio</span>
              <span><kbd>Enter</kbd> Check</span>
              <span><kbd>Esc</kbd> Reset</span>
            </div>
          </div>
