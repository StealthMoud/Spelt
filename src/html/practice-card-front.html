          <!-- Front Face -->
          <div class="card-face card-front">

                </div>

              </div>
              <div id="practice-example-container" class="clue-item hidden">
                <div class="clue-header-flex">
                  <span class="clue-label clue-label-reset">Example Context</span>
                  <div class="flex-gap-xs">
                    <button type="button" id="practice-play-example-btn" class="play-example-btn" title="Pronounce Example" aria-label="Pronounce Example">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>

                <p id="practice-example-translation" class="hidden"></p>
              </div>
              <div class="flex-row-equal">
                <div class="clue-item flex-1">
                  <span class="clue-label">Part of Speech</span>
                  <p id="practice-part-of-speech" class="clue-pos-text"></p>

                <div class="clue-item flex-1" id="practice-level-container">

                <div class="clue-item flex-1">
                  <span class="clue-label">Translation</span>
                  <p id="practice-translation"></p>
                </div>
              </div>
              <div class="flex-row-equal">
                <div class="clue-item flex-1">
                  <span class="clue-label">Pronunciation</span>
                  <div class="transcription-flex">
                    <p id="practice-transcription" class="transcription-text"></p>
                    <div id="practice-audio-container" class="audio-btn-group"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="ai-hint-bubble" class="ai-hint-bubble-box hidden">
              <span id="ai-hint-text" class="ai-hint-text-wrap"></span>

                <button id="ai-hint-regen" class="ai-bubble-btn" title="Regenerate hint" aria-label="Regenerate hint">

              </div>
            </div>

            <!-- Recall Mode Front Face Content -->

            <div id="front-recall-wrapper" class="spelling-input-wrapper recall-btn-wrap hidden">

                <kbd class="kbd-hint">Space</kbd>
              </button>
            </div>
          </div>
